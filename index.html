<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" title="Main Layout" href="styles.css">
    <title>Nutrient Hack</title>

<body>
    <header id="header">
        <!-- logo -->
        <img src="" alt="" id="logo-main" class="logo-element element-logo">

        <!-- navigation -->
         <nav id="nav1" class="nav-main"></nav>
         <nav id="nav2" class="nav-mobile"></nav>
    </header>

    <!-- wrapper -->
     <div id="wrapper" class="wrapper-container container-wrapper">
        
        <!-- 1. plate -->
         <div id="plate-container" data-plate>
            
            <div class="plate-section" data-proteins>
                <p>Proteins</p>
                <div class="plate-indicator" data-proteins-indicator></div>
            </div>
            <div class="plate-section second-child" data-carbohydrates>
                <p>Carbs</p>
                <div class="plate-indicator" data-carbohydrates-indicator></div>
            </div>
            <div class="plate-section third-child" data-alcohol>
                <p>Alcohol</p>
                <div class="plate-indicator" data-alcohol-indicator></div>
            </div>  
            <div class="plate-section" data-fats>
                <p>Fats</p>
                <div class="plate-indicator" data-fats-indicator></div>
            </div>
            
         </div>
